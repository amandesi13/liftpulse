apiVersion: apps/v1
kind: Deployment
metadata:
  name: liftpulse
  labels: {app: liftpulse}
spec:
  # SQLite: exactly one writer. Switch LIFTPULSE_DATABASE_URL to PostgreSQL to scale out.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: liftpulse}
  template:
    metadata:
      labels: {app: liftpulse}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: liftpulse
          image: ghcr.io/amandesi13/liftpulse:latest
          ports:
            - containerPort: 8000
          env:
            - name: LIFTPULSE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef: {name: liftpulse, key: admin-token}
            - name: LIFTPULSE_PUBLIC_URL
              value: https://liftpulse.example.com
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: liftpulse-data
